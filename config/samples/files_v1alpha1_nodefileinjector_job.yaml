apiVersion: files.barpilot.io/v1alpha1
kind: NodeFileInjector
metadata:
  labels:
    app.kubernetes.io/name: node-file-injector
    app.kubernetes.io/managed-by: kustomize
  name: nodefileinjector-job-sample
spec:
  # Use Job mode for one-time file injection
  mode: job

  # Optional Job configuration with full template support
  jobTemplate:
    # Automatically clean up Jobs after 5 minutes
    ttlSecondsAfterFinished: 300
    # Retry failed Jobs up to 3 times
    backoffLimit: 3
    # Kill Jobs that run longer than 10 minutes
    activeDeadlineSeconds: 600

    # Optional: Full Pod template for advanced customization
    template:
      metadata:
        labels:
          custom-label: custom-value
        annotations:
          custom-annotation: custom-value
      spec:
        # Tolerations for scheduling on tainted nodes
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule

        # Node affinity for advanced scheduling
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                    - key: disk-type
                      operator: In
                      values:
                        - ssd

        # Security context at pod level
        securityContext:
          fsGroup: 2000

        # Priority class for scheduling priority
        priorityClassName: system-node-critical

        # Customize the file-injector container resources
        containers:
          - name: file-injector
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

        # Optional: Add sidecar containers
        # - name: my-sidecar
        #   image: my-sidecar:latest
        #   ...

  # Node selector to target specific nodes (additional to template affinity)
  nodeSelector:
    kubernetes.io/os: linux

  # Source from a ConfigMap
  source:
    configMapKeyRef:
      name: my-config
      key: my-file.conf

  # Destination path on the node
  path: /etc/myapp/config.conf

  # File permissions (octal format)
  fileMode: "0644"

  # File owner (UID)
  owner: 0

  # File group (GID)
  group: 0
