apiVersion: files.barpilot.io/v1alpha1
kind: NodeFileInjector
metadata:
  labels:
    app.kubernetes.io/name: node-file-injector
    app.kubernetes.io/managed-by: kustomize
  name: nodefileinjector-secret-sample
spec:
  # Node selector to target specific nodes
  nodeSelector:
    node-role.kubernetes.io/worker: ""

  # Source from a Secret
  source:
    secret:
      name: my-secret
      key: tls.crt

  # Destination path on the node
  path: /etc/ssl/certs/app.crt

  # File permissions (octal format)
  mode: "0600"

  # File owner (UID)
  owner: 1000

  # File group (GID)
  group: 1000
