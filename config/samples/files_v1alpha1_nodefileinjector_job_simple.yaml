apiVersion: files.barpilot.io/v1alpha1
kind: NodeFileInjector
metadata:
  labels:
    app.kubernetes.io/name: node-file-injector
    app.kubernetes.io/managed-by: kustomize
  name: nodefileinjector-job-simple
spec:
  # Use Job mode for one-time file injection
  mode: job

  # Simple Job configuration (optional)
  jobTemplate:
    # Automatically clean up Jobs after completion
    ttlSecondsAfterFinished: 300

  # Source from a ConfigMap
  source:
    configMapKeyRef:
      name: my-config
      key: my-file.conf

  # Destination path on the node
  path: /etc/myapp/config.conf

  # File permissions (octal format)
  fileMode: "0644"

  # File owner (UID)
  owner: 0

  # File group (GID)
  group: 0
