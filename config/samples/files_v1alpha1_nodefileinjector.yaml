apiVersion: files.barpilot.io/v1alpha1
kind: NodeFileInjector
metadata:
  labels:
    app.kubernetes.io/name: node-file-injector
    app.kubernetes.io/managed-by: kustomize
  name: nodefileinjector-sample
spec:
  # Node selector to target specific nodes
  # Leave empty to target all nodes
  nodeSelector:
    kubernetes.io/os: linux

  # Source from a ConfigMap
  source:
    configMap:
      name: my-config
      key: my-file.conf

  # Destination path on the node
  path: /etc/myapp/config.conf

  # File permissions (octal format)
  mode: "0644"

  # File owner (UID)
  owner: 0

  # File group (GID)
  group: 0
